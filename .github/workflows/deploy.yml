name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/prod.dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/devastion/strength-application:latest
            ghcr.io/devastion/strength-application:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
